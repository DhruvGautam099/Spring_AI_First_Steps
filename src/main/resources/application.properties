spring.application.name=SpringAIMK1
spring.config.import=file:.env[.properties]
spring.ai.openai.api-key=${MY_OPENAI_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:3b
spring.ai.chat.client.enabled=false
app.groq.tts-model=canopylabs/orpheus-v1-english
app.groq.tts-voice=autumn
app.groq.vision-model=qwen/qwen3.8-27b